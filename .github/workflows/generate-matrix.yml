name: Generate Test Matrix Dashboard

on:
  push:
    branches: [main]
    paths:
      - "matrix_data/**"
      - "scripts/generate_matrix.py"
      - "scripts/fetch_ci_data.py"
  workflow_run:
    workflows: ["Beaker Jetson Testing"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch CI results from Prow/GCS
        run: |
          python scripts/fetch_ci_data.py \
            --output matrix_data/ci_results.json
        continue-on-error: true

      - name: Generate dashboard
        run: |
          python scripts/generate_matrix.py \
            --input matrix_data \
            --output docs/jetson_test_matrix.html \
            --ci-results matrix_data/ci_results.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
