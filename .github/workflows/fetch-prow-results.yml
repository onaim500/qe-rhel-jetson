name: Fetch Prow Periodic Results

on:
  # Run a bit after each Prow cron to give jobs time to finish
  # rhel-9.8: e2e-full Monday 08:00 UTC, e2e-bootc Saturday 12:00 UTC
  # rhel-10.2: add entries here when hardware is available
  schedule:
    - cron: '30 10 * * 1'   # rhel-9.8 e2e-full  - Monday   10:30 UTC  (job runs 08:00)
    - cron: '30 14 * * 6'   # rhel-9.8 e2e-bootc - Saturday 14:30 UTC  (job runs 12:00)
  workflow_dispatch:
    inputs:
      job_name:
        description: 'Prow job name to fetch'
        required: true
        default: 'periodic-ci-rh-ecosystem-edge-qe-rhel-jetson-rhel-9.8-e2e-full'
        type: choice
        options:
          - periodic-ci-rh-ecosystem-edge-qe-rhel-jetson-rhel-9.8-e2e-full
          - periodic-ci-rh-ecosystem-edge-qe-rhel-jetson-rhel-9.8-e2e-bootc

env:
  GCS_BUCKET: test-platform-results
  GCS_BASE: gs://test-platform-results/logs

jobs:
  fetch-results:
    name: Fetch & Process Prow Results
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gsutil
        run: |
          curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/opt/google-cloud-sdk
          echo "/opt/google-cloud-sdk/google-cloud-sdk/bin" >> $GITHUB_PATH

      - name: Resolve job name from schedule
        id: job
        run: |
          # Map day-of-week to job name when triggered by schedule
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job_name }}"
          else
            DOW=$(date -u +%u)  # 1=Mon 6=Sat
            case "$DOW" in
              1) JOB="periodic-ci-rh-ecosystem-edge-qe-rhel-jetson-rhel-9.8-e2e-full" ;;
              6) JOB="periodic-ci-rh-ecosystem-edge-qe-rhel-jetson-rhel-9.8-e2e-bootc" ;;
              *) echo "No job mapped for day $DOW"; exit 1 ;;
            esac
          fi
          echo "name=$JOB" >> $GITHUB_OUTPUT
          echo "Fetching results for: $JOB"

      - name: Find latest build
        id: build
        run: |
          JOB="${{ steps.job.outputs.name }}"
          GCS_JOB_PATH="${{ env.GCS_BASE }}/${JOB}"

          # Get the latest build ID (numeric directory, sorted)
          BUILD_ID=$(gsutil ls "${GCS_JOB_PATH}/" 2>/dev/null \
            | grep -oE '[0-9]{19}' | sort -n | tail -1)

          if [ -z "$BUILD_ID" ]; then
            echo "No builds found for ${JOB}"
            exit 1
          fi

          echo "id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "path=${GCS_JOB_PATH}/${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "Latest build ID: ${BUILD_ID}"

      - name: Wait for build to finish
        run: |
          BUILD_PATH="${{ steps.build.outputs.path }}"
          echo "Waiting for finished.json at ${BUILD_PATH}..."

          for i in $(seq 1 30); do
            if gsutil ls "${BUILD_PATH}/finished.json" &>/dev/null; then
              echo "Build finished."
              break
            fi
            echo "  Not finished yet, waiting 60s... ($i/30)"
            sleep 60
          done

          if ! gsutil ls "${BUILD_PATH}/finished.json" &>/dev/null; then
            echo "Timed out waiting for build to finish"
            exit 1
          fi

      - name: Download results
        run: |
          BUILD_PATH="${{ steps.build.outputs.path }}"
          mkdir -p prow-results

          # finished.json - pass/fail + timestamp
          gsutil cp "${BUILD_PATH}/finished.json" prow-results/

          # junit.xml - test results
          # Try common artifact paths
          TEST_STEP=$(echo "${{ steps.job.outputs.name }}" | grep -oP 'e2e-\w+')
          JUNIT_PATH="${BUILD_PATH}/artifacts/${TEST_STEP}/qe-rhel-jetson-pytest/artifacts/junit.xml"
          gsutil cp "${JUNIT_PATH}" prow-results/junit.xml 2>/dev/null || \
            gsutil cp "${BUILD_PATH}/artifacts/${TEST_STEP}/qe-rhel-jetson-pytest/junit.xml" prow-results/junit.xml 2>/dev/null || \
            echo "junit.xml not found, skipping"

          # build log
          gsutil cp "${BUILD_PATH}/artifacts/${TEST_STEP}/qe-rhel-jetson-pytest/build-log.txt" prow-results/build-log.txt 2>/dev/null || true

          ls -lh prow-results/

      - name: Parse results
        id: results
        run: |
          PASSED=$(python3 -c "
          import json, sys
          with open('prow-results/finished.json') as f:
              d = json.load(f)
          print('true' if d.get('passed') else 'false')
          print(d.get('result', 'unknown'))
          " 2>/dev/null | head -1 || echo "false")

          RESULT=$(python3 -c "
          import json
          with open('prow-results/finished.json') as f:
              d = json.load(f)
          print(d.get('result', 'unknown'))
          " 2>/dev/null || echo "unknown")

          # Parse junit for counts if available
          if [ -f prow-results/junit.xml ]; then
            TESTS=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('prow-results/junit.xml')
          root = tree.getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          if suite is not None:
              print(f\"total={suite.get('tests','?')} failures={suite.get('failures','0')} errors={suite.get('errors','0')} skipped={suite.get('skipped','0')}\")
          " 2>/dev/null || echo "total=? failures=? errors=? skipped=?")
          else
            TESTS="junit.xml not available"
          fi

          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "result=${RESULT}" >> $GITHUB_OUTPUT
          echo "tests=${TESTS}" >> $GITHUB_OUTPUT
          echo "Result: ${RESULT}, ${TESTS}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prow-results-${{ steps.job.outputs.name }}-${{ steps.build.outputs.id }}
          path: prow-results/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          JOB="${{ steps.job.outputs.name }}"
          BUILD_ID="${{ steps.build.outputs.id }}"
          RESULT="${{ steps.results.outputs.result }}"
          TESTS="${{ steps.results.outputs.tests }}"
          ICON=$([[ "${{ steps.results.outputs.passed }}" == "true" ]] && echo "✅" || echo "❌")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ${ICON} Prow Periodic Job Results

          | Field | Value |
          |-------|-------|
          | **Job** | \`${JOB}\` |
          | **Build ID** | \`${BUILD_ID}\` |
          | **Result** | **${RESULT}** |
          | **Tests** | ${TESTS} |
          | **Prow Link** | [View on Prow](https://prow.ci.openshift.org/view/gs/${{ env.GCS_BUCKET }}/logs/${JOB}/${BUILD_ID}) |

          EOF

      - name: Fail if Prow job failed
        if: steps.results.outputs.passed == 'false'
        run: |
          echo "Prow job reported failure: ${{ steps.results.outputs.result }}"
          exit 1
