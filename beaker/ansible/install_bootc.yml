---
# Ansible Playbook: Install bootc on Jetson Beaker Machines
#
# Usage:
#   ansible-playbook -i inventory.yml install_bootc.yml \
#     -e "registry_user='Guy Gordani'" \
#     -e "registry_pass='YOUR_TOKEN'" \
#     --limit jetson-orin-05
#
# With vault for credentials:
#   ansible-playbook -i inventory.yml install_bootc.yml --ask-vault-pass
#
# Dry run:
#   ansible-playbook -i inventory.yml install_bootc.yml --check
#
# Based on: Installing bootc image on Jetson Beaker Machines - V2 (Google Doc).
# https://docs.google.com/document/d/1dyfA2f4EQjRhe3CP-JKi8S3K54ILlBg0hXQFFEnlpao

- name: Install bootc on Jetson systems
  hosts: all
  gather_facts: true
  # Run all tasks as root (superuser) - required for package installation,
  # bootc operations, and system configuration
  become: true
  become_user: root
  become_method: sudo
  
  vars:
    # Defaults for bootc_image, registry_url come from inventory.yml
    # (override with -e e.g. -e "bootc_image_tag=...")
    auto_reboot: true
    # Set to false with -e "restore_boot_order=false" to keep bootc first in boot order
    restore_boot_order: true
    # bootc install mode: "existing-root" (default) or "to-disk"
    #   existing-root: replaces running OS in-place (ESP+root must be on same device)
    #   to-disk: wipes target disk and writes fresh bootc image
    bootc_install_mode: "existing-root"
    # Target disk for to-disk mode: "nvme", "emmc", "sd", "usb", or explicit path
    bootc_install_disk: ""
  
  vars_files:
    - vars/secrets.yml  # Contains registry_user and registry_pass (encrypted with ansible-vault)
  
  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - registry_user is defined
          - registry_pass is defined
        fail_msg: "registry_user and registry_pass are required. Use -e 'registry_user=xxx registry_pass=xxx'"
    
    - name: Display target information
      ansible.builtin.debug:
        msg: |
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          Image:  {{ bootc_image }}
          OS:     {{ ansible_distribution | default('unknown') }} {{ ansible_distribution_version | default('') }}
          Arch:   {{ ansible_architecture | default('unknown') }}
  
  tasks:
    #=========================================================================
    # Step 1: Install podman
    #=========================================================================
    - name: Install podman
      ansible.builtin.dnf:
        name: podman
        state: present
      tags: [podman]
    
    #=========================================================================
    # Step 2: Save original boot order
    #=========================================================================
    - name: Get current EFI boot configuration
      ansible.builtin.command: efibootmgr
      register: efi_boot_info
      changed_when: false
      tags: [boot]
    
    - name: Parse boot order
      ansible.builtin.set_fact:
        original_boot_order: "{{ efi_boot_info.stdout | regex_search('BootOrder: (.+)', '\\1') | first }}"
      tags: [boot]
    
    - name: Find PXE boot entry
      ansible.builtin.set_fact:
        pxe_entry: "{{ efi_boot_info.stdout | regex_search('Boot([0-9A-Fa-f]{4})\\* .*PXEv4', '\\1') | first }}"
      tags: [boot]
    
    - name: Display boot information
      ansible.builtin.debug:
        msg: |
          Original boot order: {{ original_boot_order }}
          PXE entry: Boot{{ pxe_entry }}
      tags: [boot]
    
    - name: Save boot order to local file
      ansible.builtin.copy:
        content: |
          # Boot order saved at {{ (ansible_date_time | default({'iso8601': 'unknown'})).iso8601 }}
          # Host: {{ inventory_hostname }}
          {{ efi_boot_info.stdout }}
        dest: "/root/original_boot_order.txt"
        mode: '0644'
      tags: [boot]
    
    #=========================================================================
    # Step 3: Login to container registry
    #=========================================================================
    - name: Login to container registry
      ansible.builtin.command:
        cmd: podman login {{ registry_url }} -u "{{ registry_user }}" -p "{{ registry_pass }}"
      no_log: true  # Don't log credentials
      changed_when: true
      tags: [registry]
    
    #=========================================================================
    # Step 4: Pre-flight checks & Pull bootc image
    #=========================================================================
    - name: Check available disk space for container image
      ansible.builtin.shell: (df -BG --output=avail /var/lib/containers || df -BG --output=avail / | awk 'NR==2 {print $4}') | tail -n1 | sed 's/G//'
      register: disk_space
      changed_when: false
      tags: [image]

    - name: Ensure sufficient disk space for container image
      ansible.builtin.assert:
        that:
          - disk_space.stdout | trim | int > 10
        fail_msg: "Insufficient disk space. Need at least 10GB free, have {{ disk_space.stdout | trim }}GB"
      tags: [image]

    - name: Pull bootc image
      ansible.builtin.command:
        cmd: podman pull {{ bootc_image }}
      register: pull_result
      changed_when: "'Copying' in pull_result.stdout or 'Writing' in pull_result.stderr"
      async: 1800
      poll: 15
      tags: [image]

    #=========================================================================
    # Step 5a: Resolve target disk for to-disk mode
    #=========================================================================
    - name: Resolve target disk device
      ansible.builtin.shell: |
        case "{{ bootc_install_disk }}" in
          nvme)  lsblk -dnpo NAME,TYPE | awk '$2=="disk" && $1~/nvme/' | head -1 | awk '{print $1}' ;;
          emmc)  echo "/dev/mmcblk0" ;;
          sd)    # SD card: built-in slot (mmcblk1) or USB card reader (sdX)
                 RESULT=$(lsblk -dnpo NAME,TYPE | awk '$2=="disk" && $1~/mmcblk[1-9]/' | head -1 | awk '{print $1}')
                 [ -z "$RESULT" ] && RESULT=$(lsblk -dnpo NAME,TYPE | awk '$2=="disk" && $1~/sd[a-z]/' | head -1 | awk '{print $1}')
                 echo "$RESULT" ;;
          usb)   lsblk -dnpo NAME,TYPE | awk '$2=="disk" && $1~/sd[a-z]/' | head -1 | awk '{print $1}' ;;
          /dev/*) echo "{{ bootc_install_disk }}" ;;
          *)     echo "" ;;
        esac
      register: disk_resolve_result
      changed_when: false
      when: bootc_install_mode == "to-disk"
      tags: [install]

    - name: Set resolved disk fact
      ansible.builtin.set_fact:
        resolved_disk: "{{ disk_resolve_result.stdout | trim }}"
      when: bootc_install_mode == "to-disk"
      tags: [install]

    - name: Validate target disk was found
      ansible.builtin.assert:
        that:
          - resolved_disk | length > 0
        fail_msg: >
          Could not find a disk matching type "{{ bootc_install_disk }}".
          Available disks: run 'lsblk -dno NAME,TYPE,SIZE' on the target.
      when: bootc_install_mode == "to-disk"
      tags: [install]

    - name: Display install mode
      ansible.builtin.debug:
        msg: >
          Install mode: {{ bootc_install_mode }}
          {% if bootc_install_mode == 'to-disk' %}Target disk: {{ resolved_disk }}{% endif %}
      tags: [install]

    #=========================================================================
    # Step 5b: Pre-checks
    #=========================================================================
    - name: Check if target disk contains running root filesystem
      ansible.builtin.shell: |
        ROOT_DISK=$(lsblk -nso NAME,TYPE $(findmnt -n -o SOURCE /) 2>/dev/null | awk '$2=="disk"{print $1; exit}')
        TARGET_BASE=$(basename "{{ resolved_disk }}")
        if [ "$ROOT_DISK" = "$TARGET_BASE" ]; then
          echo "CONFLICT"
        else
          echo "OK"
        fi
      register: root_disk_check
      changed_when: false
      when: bootc_install_mode == "to-disk"
      tags: [install]

    - name: Fail if target disk contains running root
      ansible.builtin.assert:
        that:
          - root_disk_check.stdout | trim != "CONFLICT"
        fail_msg: >
          Cannot wipe {{ resolved_disk }} — it contains the running root filesystem (/).
          Use bootc_install_mode=existing-root to install in-place,
          or target a different disk with bootc_install_disk=<type>.
      when: bootc_install_mode == "to-disk"
      tags: [install]

    - name: Verify ESP and root are on the same disk (existing-root safety check)
      ansible.builtin.shell: |
        ESP_DISK=$(lsblk -nso NAME,TYPE $(findmnt -n -o SOURCE /boot/efi 2>/dev/null) 2>/dev/null | awk '$2=="disk"{print $1; exit}')
        ROOT_DISK=$(lsblk -nso NAME,TYPE $(findmnt -n -o SOURCE /) 2>/dev/null | awk '$2=="disk"{print $1; exit}')
        if [ -z "$ESP_DISK" ] || [ -z "$ROOT_DISK" ]; then
          echo "UNKNOWN"
        elif [ "$ESP_DISK" = "$ROOT_DISK" ]; then
          echo "OK"
        else
          echo "SPLIT:$ESP_DISK:$ROOT_DISK"
        fi
      register: esp_root_check
      changed_when: false
      when: bootc_install_mode == "existing-root"
      tags: [install]

    - name: Warn if ESP and root are on different disks
      ansible.builtin.debug:
        msg: >
          WARNING: ESP is on /dev/{{ esp_root_check.stdout.split(':')[1] }}
          but root is on /dev/{{ esp_root_check.stdout.split(':')[2] }}.
          bootc to-existing-root requires them on the same device.
          If install fails, re-provision with the NVMe kickstart or use to-disk mode.
      when:
        - bootc_install_mode == "existing-root"
        - esp_root_check.stdout is defined
        - esp_root_check.stdout | trim is match("SPLIT:.*")
      tags: [install]

    #=========================================================================
    # Step 5c: Verify target disk is safe to wipe (to-disk mode only)
    #=========================================================================
    - name: Check if target disk has LVM physical volumes
      ansible.builtin.shell: pvs --noheadings -o pv_name 2>/dev/null | grep "$(basename {{ resolved_disk }})" | tr -d ' '
      register: disk_pvs
      changed_when: false
      failed_when: false
      when: bootc_install_mode == "to-disk"
      tags: [install]

    - name: Fail if target disk is part of an active LVM VG
      ansible.builtin.assert:
        that:
          - disk_pvs.stdout | trim | length == 0
        fail_msg: >
          UNSAFE: {{ resolved_disk }} has active LVM physical volumes: {{ disk_pvs.stdout_lines | join(', ') }}.
          Removing a PV from a shared VG corrupts LVs that span multiple disks and causes emergency mode on reboot.
          Use bootc_install_mode=existing-root instead, or re-provision with the NVMe kickstart
          (reserve_jetson.py without --no-kickstart) so the OS uses a single disk.
      when:
        - bootc_install_mode == "to-disk"
        - disk_pvs.stdout is defined
      tags: [install]

    - name: Unmount non-LVM filesystems on target disk
      ansible.builtin.shell: |
        DISK_BASE=$(basename "{{ resolved_disk }}")
        mount | grep "$DISK_BASE" | awk '{print $3}' | sort -r | while read mp; do
          umount -l "$mp" 2>/dev/null || true
        done
        sync
      changed_when: true
      failed_when: false
      when: bootc_install_mode == "to-disk"
      tags: [install]

    #=========================================================================
    # Step 5d: Run bootc install
    #=========================================================================
    - name: Run bootc install to-existing-root
      ansible.builtin.command:
        cmd: >
          podman run --rm --privileged
          -v /dev:/dev
          -v /var/lib/containers:/var/lib/containers
          -v /:/target
          --pid=host --security-opt label=type:unconfined_t
          {{ bootc_image }}
          bootc install to-existing-root
          --root-ssh-authorized-keys=/target/root/.ssh/authorized_keys
          --skip-fetch-check
      register: bootc_install
      async: 2400
      poll: 15
      when: bootc_install_mode == "existing-root"
      tags: [install]

    - name: Run bootc install to-disk
      ansible.builtin.command:
        cmd: >
          podman run --rm --privileged
          -v /dev:/dev
          -v /var/lib/containers:/var/lib/containers
          -v /root/.ssh/authorized_keys:/authorized_keys:ro
          --pid=host --security-opt label=type:unconfined_t
          {{ bootc_image }}
          bootc install to-disk {{ resolved_disk }}
          --wipe
          --root-ssh-authorized-keys=/authorized_keys
          --skip-fetch-check
      register: bootc_install
      async: 2400
      poll: 15
      when: bootc_install_mode == "to-disk"
      tags: [install]

    - name: Display bootc install output
      ansible.builtin.debug:
        var: bootc_install.stdout_lines
      tags: [install]
    
    #=========================================================================
    # Step 6-7: Create EFI boot entry on target disk (to-disk mode only)
    # to-existing-root uses the existing EFI partition in place.
    # to-disk creates its own ESP on the target disk — we delete any
    # stale bootc entries and create one pointing to the target.
    #=========================================================================
    - name: Check current EFI entries after bootc install
      ansible.builtin.command: efibootmgr
      register: current_efi
      changed_when: false
      when: bootc_install_mode == "to-disk"
      tags: [efi]

    - name: Find any bootc entries (may be on wrong device)
      ansible.builtin.set_fact:
        existing_bootc_entries: "{{ current_efi.stdout | regex_findall('Boot([0-9A-Fa-f]{4})\\*.*bootc', ignorecase=True) }}"
      when: bootc_install_mode == "to-disk"
      tags: [efi]

    - name: Delete existing bootc entries (may point to wrong device)
      ansible.builtin.command: "efibootmgr -b {{ item }} -B"
      loop: "{{ existing_bootc_entries }}"
      when:
        - bootc_install_mode == "to-disk"
        - existing_bootc_entries | length > 0
      failed_when: false
      tags: [efi]

    - name: Create EFI boot entry pointing to target disk ({{ resolved_disk }})
      ansible.builtin.command:
        cmd: >
          efibootmgr --create
          --disk {{ resolved_disk }}
          --part 1
          --label "{{ boot_label }}"
          --loader "\EFI\redhat\shimaa64.efi"
      register: efi_create
      when: bootc_install_mode == "to-disk"
      tags: [efi]

    - name: Get new EFI boot configuration
      ansible.builtin.command: efibootmgr
      register: new_efi_info
      changed_when: false
      when: bootc_install_mode == "to-disk"
      tags: [efi]

    - name: Find the new bootc entry
      ansible.builtin.set_fact:
        bootc_entries: "{{ new_efi_info.stdout | regex_findall('Boot([0-9A-Fa-f]{4})\\*.*bootc', ignorecase=True) }}"
      when: bootc_install_mode == "to-disk"
      tags: [efi]

    - name: Set empty bootc_entries for existing-root mode
      ansible.builtin.set_fact:
        bootc_entries: []
      when: bootc_install_mode == "existing-root"
      tags: [efi]

    - name: Display boot configuration
      ansible.builtin.debug:
        msg: |
          {% if bootc_install_mode == 'to-disk' %}
          Target disk: {{ resolved_disk }}
          Bootc EFI entry: {{ bootc_entries | join(', ') }}
          Next boot: bootc (one-shot), then PXE first
          {% else %}
          Install mode: existing-root (EFI handled in-place by bootc)
          {% endif %}
      tags: [efi]
    
    #=========================================================================
    # Step 9: Set boot order and reboot to new image
    #=========================================================================
    - name: Set bootc as next boot (one-shot) for to-disk mode
      ansible.builtin.command: "efibootmgr -n {{ bootc_entries | first }}"
      when:
        - bootc_install_mode == "to-disk"
        - bootc_entries | length > 0
      tags: [reboot]

    - name: Reboot to bootc image
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: "Rebooting to bootc image"
      when: auto_reboot
      tags: [reboot]
    
    #=========================================================================
    # Step 10: Install additional packages for testing
    #=========================================================================
    - name: Wait for system to be accessible
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: auto_reboot | bool
      tags: [verify]

    - name: Detect RHEL version from /etc/redhat-release
      ansible.builtin.shell: |
        if [ -f /etc/redhat-release ]; then
          grep -oP '\d+\.\d+' /etc/redhat-release | head -1
        else
          echo "9.7"
        fi
      register: detected_rhel_version
      changed_when: false
      tags: [packages]

    - name: Set RHEL version facts
      ansible.builtin.set_fact:
        rhel_version: "{{ ansible_distribution_version | default(detected_rhel_version.stdout | trim) }}"
        rhel_major_version: "{{ ansible_distribution_major_version | default(detected_rhel_version.stdout.split('.')[0] | trim) }}"
      tags: [packages]

    - name: Add RHEL AppStream repository
      ansible.builtin.command:
        cmd: >
          dnf config-manager --add-repo
          https://download.devel.redhat.com/rhel-{{ rhel_major_version }}/nightly/RHEL-{{ rhel_major_version }}/latest-RHEL-{{ rhel_version }}.0/compose/AppStream/aarch64/os/
      register: appstream_repo_result
      changed_when: appstream_repo_result.rc == 0
      failed_when: false
      tags: [packages]

    - name: Add RHEL BaseOS repository
      ansible.builtin.command:
        cmd: >
          dnf config-manager --add-repo
          https://download.devel.redhat.com/rhel-{{ rhel_major_version }}/nightly/RHEL-{{ rhel_major_version }}/latest-RHEL-{{ rhel_version }}.0/compose/BaseOS/aarch64/os/
      register: baseos_repo_result
      changed_when: baseos_repo_result.rc == 0
      failed_when: false
      tags: [packages]

    # download.devel.redhat.com uses a Red Hat internal self-signed certificate
    # chain. Without sslverify=0, dnf fails with "SSL peer certificate" errors
    - name: Disable SSL verification for nightly repos (self-signed cert chain)
      ansible.builtin.shell: |
        for repo in /etc/yum.repos.d/download.devel.redhat.com_*.repo; do
          [ -f "$repo" ] && sed -i 's/^\(sslverify\s*=\).*/\1=0/' "$repo"
          grep -q '^sslverify' "$repo" 2>/dev/null || echo 'sslverify=0' >> "$repo"
        done
      changed_when: true
      failed_when: false
      tags: [packages]

    - name: Install EPEL repository (required for can-utils)
      ansible.builtin.dnf:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ rhel_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      failed_when: false
      tags: [packages]

    - name: Install additional testing packages
      ansible.builtin.dnf:
        name:
          - podman
          - can-utils
          - usbutils
          - pciutils
        state: present
      failed_when: false
      tags: [packages]

    #=========================================================================
    # Step 11: Verify deployment
    #=========================================================================
    - name: Check bootc status
      ansible.builtin.command: bootc status
      register: bootc_status
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Check rpm-ostree status
      ansible.builtin.command: rpm-ostree status
      register: rpm_ostree_status
      changed_when: false
      failed_when: false
      tags: [verify]
    
    - name: Check running kernel
      ansible.builtin.command: uname -r
      register: kernel_version
      changed_when: false
      tags: [verify]

    #=========================================================================
    # Step 12: Restore original boot order (PXE first, EFI shell second)
    #   Skip with: -e "restore_boot_order=false"
    #   For to-disk mode: keep bootc entry (needed for future boots),
    #     put PXE first so Beaker reservations work
    #   For existing-root mode: delete bootc entry (not needed, OS boots
    #     via the original EFI entry)
    #=========================================================================
    - name: Calculate PXE-first boot order (keeping bootc entry for to-disk)
      ansible.builtin.set_fact:
        pxe_first_order: >-
          {{ ([pxe_entry] +
              (original_boot_order.split(',') | reject('eq', pxe_entry) | list) +
              (bootc_entries | difference(original_boot_order.split(',')))) | join(',') }}
      when: bootc_install_mode == "to-disk"
      tags: [restore]

    - name: Calculate PXE-first boot order (existing-root)
      ansible.builtin.set_fact:
        pxe_first_order: >-
          {{ ([pxe_entry] +
              (original_boot_order.split(',') | reject('in', bootc_entries) | reject('eq', pxe_entry) | list)) | join(',') }}
      when: bootc_install_mode == "existing-root"
      tags: [restore]

    - name: Restore original boot order (PXE first)
      ansible.builtin.command: "efibootmgr -o {{ pxe_first_order }}"
      when: restore_boot_order | bool
      tags: [restore]

    - name: Delete bootc EFI entries (existing-root only)
      ansible.builtin.command: "efibootmgr -b {{ item }} -B"
      loop: "{{ bootc_entries }}"
      when:
        - restore_boot_order | bool
        - bootc_install_mode == "existing-root"
        - bootc_entries | length > 0
      failed_when: false
      tags: [restore]

    - name: Get final EFI boot configuration
      ansible.builtin.command: efibootmgr
      register: final_efi_info
      changed_when: false
      tags: [restore]

    - name: Display boot order status
      ansible.builtin.debug:
        msg: |
          {% if restore_boot_order | bool %}
          Boot order RESTORED to PXE-first:
            Order: {{ pxe_first_order }}
          {% if bootc_install_mode == 'existing-root' %}
            Deleted bootc entries: {{ bootc_entries | join(', ') }}
          {% else %}
            Kept bootc entries: {{ bootc_entries | join(', ') }} (needed for future boots)
          {% endif %}
          {% else %}
          Boot order NOT restored (restore_boot_order=false)
            To restore later run:
              ssh root@{{ ansible_host }} "efibootmgr -o {{ pxe_first_order }}"
          {% endif %}

          Current EFI boot config:
          {{ final_efi_info.stdout }}
      tags: [restore]

    #=========================================================================
    # Summary
    #=========================================================================
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Bootc Installation Complete!
          ========================================
          Host:   {{ inventory_hostname }} ({{ ansible_host }})
          Kernel: {{ kernel_version.stdout }}
          Image:  {{ bootc_image }}
          Boot order restored: {{ restore_boot_order | bool }}
          PXE entry: Boot{{ pxe_entry }}
          ========================================
      tags: [verify]

